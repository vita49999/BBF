function readForm() {
  const values={};
  const form=$("agreementForm");
  const read=id=>{
    const selected=[...form.querySelectorAll(`input[name="${id}"]:checked`)].map(control=>control.value);
    if(selected.length) return ["channel","weekdays","timeSlots"].includes(id)?selected:selected[0];
    const control=form.elements.namedItem(id);
    return ["select-one","text","textarea","number"].includes(control?.type)?control.value.trim():"";
  };
  for(const [id,,type] of fields) {
    if(type==="rules"||type==="files") continue;
    const value=read(id);
    if(valid(value)) values[id]=value;
    for(const [key,,,condition] of supplements[id]||[]) {
      const extra=read(key);
      if(conditionActive(values,id,condition)&&valid(extra)) values[key]=extra;
    }
  }
  for(const key of fileFields) if(session.files[key]?.length) values[key]=session.files[key];
  const rules=[...form.querySelectorAll("[data-rule]")].map(row=>{
    const parts=Object.fromEntries([...row.querySelectorAll("[data-part]")].filter(control=>control.type!=="radio"||control.checked).map(control=>[control.dataset.part,control.value.trim()]));
    const {method="",payment="",frequency="",frequencyNote="",shortage="",note=""}=parts;
    const files=session.files[row.dataset.rule]||[];
    return {...readRuleScope(row),method,payment,frequency,frequencyNote,shortage,note,files};
  }).filter(rule=>rule.source==="all"||[rule.code,rule.productName,rule.method,rule.payment,rule.frequency,rule.frequencyNote,rule.shortage,rule.note,rule.files].some(valid));
  if(rules.length) values.rules=rules;
  return values;
}
function refreshDraft() {

  $("shopCount").textContent=`${metric.count}/${suggested.length} 项已完善`;
  $("shopBar").style.width=metric.percent+"%";
  if(!editable) return;
  const form=$("agreementForm");

    element.hidden=!conditionActive(values,element.dataset.when,element.dataset.value);

  }
  for(const row of form.querySelectorAll("[data-rule]")) {

    box.classList.toggle("suggested-empty",box.hasAttribute("data-suggest")&&!selected);
  }
  for(const box of form.querySelectorAll(".clearable,.select-clear-row")) box.querySelector("button").hidden=!box.querySelector("input,textarea,select").value;
}

}

function addFiles(id,incoming) {

function showFile(button) {
  const uploads=button.closest(".upload");
  const group=button.closest("[data-file-group]");
  const files=uploads?session.files[uploads.querySelector("[data-attach]").dataset.attach]:detailFiles[Number(group.dataset.fileGroup)];
  const file=files[Number(button.dataset.fileIndex)];
  if(!file) return;
  const mime=file.blob?.type||"";
  const preview=/^(image\/(png|jpeg|gif|webp|bmp|avif)|application\/pdf|text\/plain)$/.test(mime);
  if(button.dataset.fileAction==="view"&&!preview) {
    $("formError").textContent="此文件类型可下载后查看。";
    return;
  }
  const url=file.blob?URL.createObjectURL(file.blob):file.url;
  if(!/^(blob:|data:application\/octet-stream;base64,)/.test(url||"")) return;
  const link=document.createElement("a");
  link.href=url;
  if(button.dataset.fileAction==="download") link.download=file.name;
  else {
    const frame=$("previewFrame");
    frame.src=url;
    $("previewTitle").textContent=file.name;
    $("filePreview").showModal();
    $("filePreview").addEventListener("close",()=>{
      frame.removeAttribute("src");
      if(file.blob) URL.revokeObjectURL(url);
    },{once:true});
  }
  if(link.download) {
    link.click();
    if(file.blob) setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
}
$("agreementForm").addEventListener("click",event=>{

$("agreementForm").onsubmit=async event=>{
  event.preventDefault();
  if(session.mode!=="edit"||!canEdit(session.id)||session.pending)return;
  const values=readForm();
  const {id}=session;
  const bulk=$("applyAll").checked;
  if(!hasContent(values)&&(bulk||!hasContent(getRecord(id).values))) {
    $("formError").textContent="请填写至少一项有效约定。";
    return;
  }
  if(values.confirmPercent&&(!/^\d+(\.\d+)?$/.test(values.confirmPercent)||Number(values.confirmPercent)>100)) {
    $("formError").textContent="部分确认比例请输入 0 至 100 之间的数字。";
    return;
  }
  const when=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date());
  const targets=bulk?shops.filter(([shopId])=>canEdit(shopId)).map(([shopId])=>shopId):[id];
  if(bulk&&!window.confirm(`将已填写字段应用到同一商户的 ${targets.length} 家启用店铺？其他店铺的同名字段会更新，未填写字段保留。`)) return;
  const records={...state.records};
  for(const target of targets) {
    const saved=target===id?values:{...getRecord(target).values,...values};
    for(const [parent,items] of Object.entries(supplements)) {
      for(const [key,,,condition] of items) if(!conditionActive(saved,parent,condition)) delete saved[key];
    }
    records[recordKey(target)]={values:saved,who:"交付人员 A",when};
  }
  const next={...state,records};
  session.pending=1;
  $("save").disabled=true;
  $("agreementForm").inert=true;
  try {
    await persist(next);
  } catch {
    $("formError").textContent="浏览器无法保存记录。请检查本地存储是否可用，或减少附件后重试。";
    return;
  } finally {
    session.pending=0;
    $("save").disabled=false;
    $("agreementForm").inert=false;
  }
  state=next;
  render();
  session.trigger=document.querySelector(`[data-open="${id}"][data-mode="${session.trigger?.dataset.mode || "view"}"]`);
  switchMode("view");
  notify(bulk?`已应用到 ${targets.length} 家店铺`:hasContent(values)?"约定已保存":"店铺约定已清空");
};

  if(button) openForm(button.dataset.open,button.dataset.mode,button);
});
const crmTabs=["概览","账户与映射","组织与KA","账期","资金","转介绍与佣金","店铺与履约","订单","客户动态","周报记录"];
const crmContext=[
  [["客户ID","90001"],["客户名称","演示客户"],["全局客户","g_demo_001"],["代发币种","USD"]],
  [["客户ID","90001"],["所属全局客户","g_demo_001"],["关联应用","Bps"]],
  [["业务经理","演示业务经理"],["业务组","演示业务组"],["业务助理","—"]],
  [["账期状态","—"],["时间账期","—"],["额度账期","—"],["备货账期","—"]],
  [["币种","USD"],["可用余额","—"],["冻结金额","—"]],
  [["介绍人","—"],["佣金规则","—"]],
  [],
  [["订单量","—"],["销售额","—"]],
  [["客户动态","暂无演示记录"]],
  [["周报记录","暂无演示记录"]]
];
let selectedTab=6;
function drawTabs() {
  $("crmTabs").innerHTML=crmTabs.map((label,i)=>`<button id="crm-tab-${i}" role="tab" aria-selected="${i===selectedTab}" aria-controls="${i===6?"fulfillment":"crmContext"}" tabindex="${i===selectedTab?0:-1}" data-tab="${i}">${label}</button>`).join("");
  $("fulfillment").hidden=selectedTab!==6;
  $("crmContext").hidden=selectedTab===6;
  $("crmContext").setAttribute("aria-labelledby","crm-tab-"+selectedTab);
  if(selectedTab!==6) $("crmContext").innerHTML=`<h2>${crmTabs[selectedTab]}</h2><dl class="context-data">${crmContext[selectedTab].map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join("")}</dl>`;
}
function selectTab(index) {
  selectedTab=index;
  drawTabs();
  window.scrollTo({top:0,behavior:"instant"});
  $("crm-tab-"+index).focus({preventScroll:true});
}
$("crmTabs").onclick=event=>{
  const tab=event.target.closest("[data-tab]");
  if(tab) selectTab(Number(tab.dataset.tab));
};
$("crmTabs").onkeydown=event=>{
  const offset={ArrowRight:1,ArrowLeft:-1}[event.key];
  if(!offset && !["Home","End"].includes(event.key)) return;
  event.preventDefault();
  selectTab(event.key==="Home"?0:event.key==="End"?9:(selectedTab+offset+crmTabs.length)%crmTabs.length);
};
document.querySelector(".crm-dimension").onclick=event=>{
  const button=event.target.closest("[data-dimension]");
  if(!button)return;
  const global=button.dataset.dimension==="global";
  for(const item of document.querySelectorAll("[data-dimension]")) item.setAttribute("aria-pressed",String(item===button));
  $("profileName").textContent=global?"g_demo_001":"演示客户";
  $("profileIds").innerHTML=global?"<small>全局客户</small> <b>g_demo_001</b>　<small>关联客户ID</small> <b>90001</b>":"<small>客户ID</small> <b>90001</b>　 <small>所属全局客户</small> <b>g_demo_001</b>";
};
for(const item of document.querySelectorAll("[data-icon]")) item.innerHTML=icon(item.dataset.icon);
$("role").onchange=render;
drawTabs();
initialize();
</script>
</html>
