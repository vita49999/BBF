    const type=code?(source==="library"?product[0]:parts.type):"";
    return {source,type,code,method,payment,frequency,frequencyNote,shortage,note};
  }).filter(rule=>rule.source==="all"||[rule.code,rule.method,rule.payment,rule.frequency,rule.frequencyNote,rule.shortage,rule.note].some(valid));
  if (rules.length) values.rules=rules;
  return {values,incomplete:false};
}
function refreshDraft() {
  if(!$("shopCompletion")) return;
  const values=session.mode==="edit"&&canEdit(session.id)?readForm().values:session.values;
  $("shopCompletion").textContent=completionText(summarize([values]));
}
function openForm(id,mode,trigger) {
  if (!shopInfo(id)) return;
  if (!canEdit(id)) mode="view";
  session={id,mode,trigger,pending:0,values:structuredClone(getRecord(id).values)};
  drawForm();
  $("dialog").showModal();
  document.body.classList.add("modal-open");
}
function isDirty() {
  if (session.mode!=="edit" || !canEdit(session.id)) return false;
  const {values,incomplete}=readForm();
  const original=getRecord(session.id).values;
  return $("applyAll").checked || session.pending>0 || incomplete || [...new Set([...Object.keys(values),...Object.keys(original)])].some(k=>JSON.stringify(values[k])!==JSON.stringify(original[k]));
}
function discardApproved() {
  return !isDirty() || window.confirm("当前有未保存的修改，是否放弃？");
}
function requestClose() { if(discardApproved()) $("dialog").close(); }
$("dialog").addEventListener("close",()=>{
  document.body.classList.remove("modal-open");
  if (session.trigger?.isConnected) session.trigger.focus({preventScroll:true});
});
$("dialog").addEventListener("cancel",event=>{event.preventDefault();requestClose();});
$("close").onclick=requestClose;
function switchMode(mode) {
  session.mode=mode;
  session.values=structuredClone(getRecord(session.id).values);
  drawForm();
  $(mode==="edit"?"cancel":canEdit(session.id)?"editMode":"close").focus({preventScroll:true});
}
$("editMode").onclick=()=>{
  if(canEdit(session.id)) switchMode("edit");
};
$("cancel").onclick=()=>{
  if (session.mode==="view") requestClose();
  else if (discardApproved()) switchMode("view");
};
$("agreementForm").addEventListener("input",()=>{
  $("formError").textContent="";
  refreshDraft();
});
function readAttachment(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,size:file.size,url:"data:application/octet-stream;base64,"+String(reader.result).split(",")[1]});
    reader.onerror=reader.onabort=reject;
    reader.readAsDataURL(file);
  });
}
$("agreementForm").addEventListener("change",async event=>{
  const {target}=event;
  if (target.name==="hoursMode") {
    $("f-hours").hidden=target.value!=="指定时段";
    refreshDraft();
    return;
  }
  if (target.matches('[data-part="source"]')) {
    const row=target.closest("[data-rule]");
    row.querySelector("[data-manual]").hidden=target.value!=="manual";
    row.querySelector("[data-library]").hidden=target.value!=="library";
    refreshDraft();
    return;
  }
  const field=target.dataset.attach;
  if(!field || !target.files.length || session.pending) return;
  const files=[...target.files];
  target.value="";
  const current=session;
  const size=["shippingFiles","noteFiles"].flatMap(name=>current.values[name]||[]).concat(files).reduce((sum,file)=>sum+file.size,0);
  if(size>attachmentLimit) {
    $("formError").textContent="附件总大小超过 2 MB，请选择较小的文件。";
    return;
  }
  current.pending++;
  $("save").disabled=true;
  for(const input of $("agreementForm").querySelectorAll("[data-attach]")) input.disabled=true;
  try {
    const loaded=await Promise.all(files.map(readAttachment));
    if(session!==current||!$("dialog").open) return;
    current.values[field]=[...(current.values[field]||[]),...loaded];
    $("list-"+field).innerHTML=attachmentRows(field);
    refreshDraft();
  } catch {
    if(session===current&&$("dialog").open) $("formError").textContent="附件读取失败，请重新选择文件。";
  } finally {
    current.pending--;
    if(session===current) {
      $("save").disabled=false;
      for(const input of $("agreementForm").querySelectorAll("[data-attach]")) input.disabled=false;
    }
  }
});
$("agreementForm").addEventListener("click",event=>{
  if (session.mode!=="edit" || !canEdit(session.id)) return;
  const clear=event.target.closest("[data-clear-choice]");
  if(clear) {
    const selected=clear.parentElement.querySelector("input:checked");
    if(!selected) return;
    selected.checked=false;
    if(selected.name==="hoursMode") $("f-hours").hidden=true;
    if(selected.dataset.part==="source") {
      const card=selected.closest("[data-rule]");
      card.querySelector("[data-manual]").hidden=true;
      card.querySelector("[data-library]").hidden=true;
    }
    refreshDraft();
    return;
  }
  if (event.target.closest("[data-add-rule]")) {
    $("ruleRows").insertAdjacentHTML("beforeend",ruleRow());
    numberRules();
    $("ruleRows").lastElementChild.querySelector("input").focus();
  }
  const file=event.target.closest("[data-remove-file]");
  if(file) {
    const field=file.dataset.removeFile;
    session.values[field].splice(Number(file.dataset.index),1);
    $("list-"+field).innerHTML=attachmentRows(field);
    $("formError").textContent="";
    refreshDraft();
  }
  const remove=event.target.closest("[data-remove-rule]");
  if(remove) {remove.closest("[data-rule]").remove();numberRules();$("formError").textContent="";refreshDraft();}
});
$("agreementForm").onsubmit=event=>{
  event.preventDefault();
  if(session.mode!=="edit"||!canEdit(session.id)||session.pending)return;
  const {values,incomplete}=readForm();
  const recordId=recordKey(session.id);
  const previous=state.records;
  const bulk=$("applyAll").checked;
  const clearingShop=!bulk&&hasContent(previous[recordId]?.values||{})&&!incomplete;
  if(!hasContent(values)&&!clearingShop) {
    $("formError").textContent="请填写至少一项有效约定。";
    return;
  }
  const when=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date());
  const id=session.id;
  const targets=bulk?shops.filter(([shopId])=>canEdit(shopId)).map(([shopId])=>shopId):[id];
  if (bulk && !window.confirm(`将已填写字段应用到同一商户的 ${targets.length} 家启用店铺？其他店铺的同名字段会更新，未填写字段保留。`)) return;
  const next={...previous};
  for(const target of targets) {
    const targetKey=recordKey(target);
    const savedValues=target===id?values:{...getRecord(target).values,...values};
    const bytes=["shippingFiles","noteFiles"].flatMap(field=>savedValues[field]||[]).reduce((sum,file)=>sum+file.size,0);
    if (bytes>attachmentLimit) {
      $("formError").textContent=`${shopInfo(target)[1]} 的附件合计超过 2 MB，本次未保存。`;
      return;
    }
    next[targetKey]={values:savedValues,who:"交付人员 A",when};
  }
  state.records=next;
  if(!persist()) {
    state.records=previous;
    $("formError").textContent="浏览器无法保存记录。请检查本地存储是否可用，或减少附件后重试。";
    return;
  }
  render();
  session.trigger=document.querySelector(`[data-open="${id}"][data-mode="${session.trigger?.dataset.mode || "view"}"]`);
  switchMode("view");
  notify((bulk?`已应用到 ${targets.length} 家店铺`:hasContent(values)?"约定已保存":"店铺约定已清空")+(incomplete?"，未完整的商品规则已略过":""));
};
document.querySelector("main").addEventListener("click",event=>{
  const button=event.target.closest("[data-open]");
  if(button) openForm(button.dataset.open,button.dataset.mode,button);
});
const crmTabs=["概览","账户与映射","组织与KA","账期","资金","转介绍与佣金","店铺与履约","订单","客户动态","周报记录"];
const crmContext=[
  [["客户ID","90001"],["客户名称","演示客户"],["全局客户","g_demo_001"],["代发币种","USD"]],
  [["客户ID","90001"],["所属全局客户","g_demo_001"],["关联应用","Bps"]],
  [["业务经理","演示业务经理"],["业务组","演示业务组"],["业务助理","—"]],
  [["账期状态","—"],["时间账期","—"],["额度账期","—"],["备货账期","—"]],
  [["币种","USD"],["可用余额","—"],["冻结金额","—"]],
  [["介绍人","—"],["佣金规则","—"]],
  [],
  [["订单量","—"],["销售额","—"]],
  [["客户动态","暂无演示记录"]],
  [["周报记录","暂无演示记录"]]
];
let selectedTab=6;
function drawTabs() {
  $("crmTabs").innerHTML=crmTabs.map((label,i)=>`<button id="crm-tab-${i}" role="tab" aria-selected="${i===selectedTab}" aria-controls="${i===6?"fulfillment":"crmContext"}" tabindex="${i===selectedTab?0:-1}" data-tab="${i}">${label}</button>`).join("");
  $("fulfillment").hidden=selectedTab!==6;
  $("crmContext").hidden=selectedTab===6;
  $("crmContext").setAttribute("aria-labelledby","crm-tab-"+selectedTab);
  if(selectedTab!==6) $("crmContext").innerHTML=`<h2>${crmTabs[selectedTab]}</h2><dl class="context-data">${crmContext[selectedTab].map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join("")}</dl>`;
}
function selectTab(index) {
  selectedTab=index;
  drawTabs();
  window.scrollTo({top:0,behavior:"instant"});
  $("crm-tab-"+index).focus({preventScroll:true});
}
$("crmTabs").onclick=event=>{
  const tab=event.target.closest("[data-tab]");
  if(tab) selectTab(Number(tab.dataset.tab));
};
$("crmTabs").onkeydown=event=>{
  const offset={ArrowRight:1,ArrowLeft:-1}[event.key];
  if(!offset && !["Home","End"].includes(event.key)) return;
  event.preventDefault();
  selectTab(event.key==="Home"?0:event.key==="End"?9:(selectedTab+offset+crmTabs.length)%crmTabs.length);
};
document.querySelector(".crm-dimension").onclick=event=>{
  const button=event.target.closest("[data-dimension]");
  if(!button)return;
  const global=button.dataset.dimension==="global";
  for(const item of document.querySelectorAll("[data-dimension]")) item.setAttribute("aria-pressed",String(item===button));
  $("profileName").textContent=global?"g_demo_001":"演示客户";
  $("profileIds").innerHTML=global?"<small>全局客户</small> <b>g_demo_001</b>　<small>关联客户ID</small> <b>90001</b>":"<small>客户ID</small> <b>90001</b>　 <small>所属全局客户</small> <b>g_demo_001</b>";
};
for(const item of document.querySelectorAll("[data-icon]")) item.innerHTML=icon(item.dataset.icon);
$("role").onchange=render;
drawTabs();
render();
</script>
